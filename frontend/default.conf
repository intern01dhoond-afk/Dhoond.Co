server {
    listen 80;
    
    # Redirect non-www to www
    if ($host = 'dhoond.co') {
        return 301 https://www.dhoond.co$request_uri;
    }

    include /etc/nginx/mime.types;
    types {
        video/mp4 mp4;
    }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Cache static assets (JS, CSS, images, fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|mp4)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Quotation Tool routes - Reverse Proxy to Vercel
    location = /Quotation {
        return 301 /quotation/;
    }
    location = /Quotation/ {
        return 301 /quotation/;
    }
    location = /quotation {
        return 301 /quotation/;
    }

    location ^~ /quotation/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        proxy_pass https://dhoond-painting-quotation.vercel.app/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host dhoond-painting-quotation.vercel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/index.html /index.html;
    }
}
